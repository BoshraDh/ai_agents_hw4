[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hw4-graphify-debugger"
version = "1.00"
description = "Token-efficient agentic bug finder using Graphify + LangGraph"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "networkx>=3.3",
    "graphifyy>=0.1.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.17.1",
    "openai>=2.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hw4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/hw4 --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src/hw4"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
]
